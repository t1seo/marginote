name: Release
on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 't1seo/marginote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout (v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Bun (v2)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run check:release
      - name: Verify the exact release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run validate:release --tag "$RELEASE_TAG"
      - name: Publish plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" main.js manifest.json styles.css
          --verify-tag --title "Marginote $RELEASE_TAG" --notes-file CHANGELOG.md --latest
